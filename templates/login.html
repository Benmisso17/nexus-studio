<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | NEXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    body { font-family:'Tajawal',sans-serif; background: #0a0512; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #fbbf24; margin-bottom: 20px; }
    input { width: 100%; padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 20px; outline: none; text-align: center; font-family: inherit; }
    button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, #7c3aed, #06b6d4); color: #fff; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
    <h2>دخول الإدارة</h2>
    <form method="POST">
        <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
        <button type="submit">دخول</button>
    </form>
</div>
</body>
</html>
