<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرسائل الواردة | NEXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
    body { font-family:'Tajawal',sans-serif; background: #0a0512; color: #fff; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 30px; border-radius: 24px; backdrop-filter: blur(12px); }
    h2 { text-align: center; color: #fbbf24; margin-bottom: 20px; }
    .nav-links { text-align: center; margin-bottom: 20px; }
    .nav-links a { color: #06b6d4; text-decoration: none; margin: 0 10px; font-size: 0.9rem; }
    .msg-card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
    .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
    .msg-name { font-weight: bold; color: #c4b5fd; font-size: 1.1rem; }
    .msg-email { font-size: 0.85rem; color: #94a3b8; }
    .msg-text { color: #e2e8f0; line-height: 1.6; margin-bottom: 15px; }
    .btn-del { background: #ef4444; color: white; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; transition: 0.3s; display: inline-block; }
    .btn-del:hover { background: #dc2626; }
    .empty { text-align: center; color: #94a3b8; padding: 40px; }
</style>
</head>
<body>
<div class="container">
    <div class="nav-links">
        <a href="/admin">➕ إضافة مشروع</a>
        <a href="/manage">📁 إدارة المشاريع</a>
        <a href="/">🏠 الرئيسية</a>
        <a href="/logout" style="color:#ef4444;">🚪 خروج</a>
    </div>
    <h2>صندوق الرسائل الواردة</h2>
    
    {% for m in messages %}
    <div class="msg-card">
        <div class="msg-header">
            <span class="msg-name">👤 {{ m.name }}</span>
            <a href="/delete_message/{{ m.id }}" class="btn-del" onclick="return confirm('هل تريد حذف هذه الرسالة؟');">حذف</a>
        </div>
        <div class="msg-email">📧 {{ m.email }}</div>
        <div class="msg-text">{{ m.message }}</div>
    </div>
    {% else %}
    <div class="empty">لا توجد رسائل جديدة حالياً.</div>
    {% endfor %}
    
</div>
</body>
</html>
