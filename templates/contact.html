<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معي | NEXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    body { font-family:'Tajawal',sans-serif; background: #0a0512; color: #f8fafc; margin: 0; padding: 20px 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .aurora { position:fixed; inset:0; z-index:-1; overflow:hidden; }
    .aurora span { position:absolute; border-radius:50%; filter:blur(120px); opacity:.45; animation:float 20s ease-in-out infinite; }
    .aurora span:nth-child(1) { width:600px; height:600px; background:#ec4899; bottom:-200px; right:-150px; }
    .aurora span:nth-child(2) { width:500px; height:500px; background:#06b6d4; top:-100px; left:-150px; animation-delay:-7s; }
    @keyframes float { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(50px,-50px) scale(1.1); } }
    .contact-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; width: 100%; max-width: 500px; box-sizing: border-box; }
    h2 { text-align: center; color: #fbbf24; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-family: inherit; outline: none; box-sizing: border-box; }
    button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, #7c3aed, #06b6d4); color: #fff; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    .divider { text-align: center; color: #94a3b8; margin: 30px 0 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 30%; height: 1px; background: rgba(255,255,255,0.1); }
    .divider::before { right: 0; }
    .divider::after { left: 0; }
    .socials { display: flex; justify-content: center; gap: 15px; }
    .socials a { color: #fff; font-size: 1.3rem; transition: 0.3s; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); text-decoration: none; }
    .socials a:hover { transform: translateY(-5px); color: #0a0512; }
    .socials a.discord:hover { background: #5865F2; }
    .socials a.insta:hover { background: #E1306C; }
    .socials a.facebook:hover { background: #1877F2; }
    .back-link { display: block; text-align: center; margin-top: 25px; color: #94a3b8; text-decoration: none; }
</style>
</head>
<body>
<div class="aurora"><span></span><span></span></div>
<div class="contact-card">
    <h2>أرسل لي رسالة</h2>
    <form action="/contact" method="POST">
        <div class="form-group">
            <input type="text" name="name" placeholder="اسمك الكريم" required>
        </div>
        <div class="form-group">
            <input type="email" name="email" placeholder="بريدك الإلكتروني أو حسابك" required>
        </div>
        <div class="form-group">
            <textarea name="message" rows="4" placeholder="كيف يمكنني مساعدتك؟" required></textarea>
        </div>
        <button type="submit">إرسال</button>
    </form>
    
    <div class="divider">أو تواصل معي عبر</div>
    <div class="socials">
        <a href="https://discord.com/users/1134928472167415918" target="_blank" class="discord"><i class="fab fa-discord"></i></a>
        <a href="https://instagram.com/been_misso" target="_blank" class="insta"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/share/19nhZGjKkL/" target="_blank" class="facebook"><i class="fab fa-facebook-f"></i></a>
    </div>
    <a href="/" class="back-link">← العودة للرئيسية</a>
</div>
</body>
</html>
